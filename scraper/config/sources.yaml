# Sources configuration for APIx Scraper
# Optimized for high-throughput, low latency, and 100% genuine flight coverage on AWS EC2

otas:
  # 1. Primary multi-carrier mega-aggregator (captures IndiGo, Air India, Akasa, SpiceJet, AI Express)
  - name: easemytrip
    display_name: "EaseMyTrip"
    base_url: "https://www.easemytrip.com"
    enabled: true
    scraper_class: "scrapers.otas.easemytrip_scraper.EaseMyTripScraper"

  # 2. Fast independent multi-carrier OTA
  - name: ixigo
    display_name: "Ixigo"
    base_url: "https://www.ixigo.com"
    enabled: true
    scraper_class: "scrapers.otas.ixigo_scraper.IxigoScraper"

  # Disabled: returns empty DOM container in headless Chromium
  - name: cleartrip
    display_name: "Cleartrip"
    base_url: "https://www.cleartrip.com"
    enabled: false
    scraper_class: "scrapers.otas.cleartrip_scraper.CleartripScraper"

  # Disabled: Akamai Bot Manager hard-blocks cloud IPs
  - name: makemytrip
    display_name: "MakeMyTrip"
    base_url: "https://www.makemytrip.com"
    enabled: false
    scraper_class: "scrapers.otas.makemytrip_scraper.MakeMyTripScraper"

  - name: goibibo
    display_name: "Goibibo"
    base_url: "https://www.goibibo.com"
    enabled: false
    scraper_class: "scrapers.otas.goibibo_scraper.GoibiboScraper"

  - name: yatra
    display_name: "Yatra"
    base_url: "https://www.yatra.com"
    enabled: false
    scraper_class: "scrapers.otas.yatra_scraper.YatraScraper"

airlines:
  # 1. Genuine Direct Carrier: fast React DOM extraction (~12-16s)
  - name: spicejet
    display_name: "SpiceJet"
    base_url: "https://www.spicejet.com"
    enabled: true
    scraper_class: "scrapers.airlines.spicejet_scraper.SpiceJetScraper"

  # Disabled: direct portal redirects; all flights covered via EaseMyTrip & Ixigo
  - name: air_india_express
    display_name: "Air India Express"
    base_url: "https://www.airindiaexpress.com"
    enabled: false
    scraper_class: "scrapers.airlines.air_india_express_scraper.AirIndiaExpressScraper"

  # Disabled: direct portal blocks cloud IPs; all flights covered via EaseMyTrip & Ixigo
  - name: indigo
    display_name: "IndiGo"
    base_url: "https://www.goindigo.in"
    enabled: false
    scraper_class: "scrapers.airlines.indigo_scraper.IndiGoScraper"

  - name: akasa
    display_name: "Akasa Air"
    base_url: "https://www.akasaair.com"
    enabled: false
    scraper_class: "scrapers.airlines.akasa_scraper.AkasaScraper"

  - name: air_india
    display_name: "Air India"
    base_url: "https://www.airindia.com"
    enabled: false
    scraper_class: "scrapers.airlines.air_india_scraper.AirIndiaScraper"
