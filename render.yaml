services:
  # 1. Web Service for Scraper Engine & Twitter Escalation API
  - type: web
    name: aura-scraper-service
    env: python
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium
    startCommand: cd scraper && python main.py --schedule
    envVars:
      - key: DATABASE_URL
        sync: false # Set this in the Render Dashboard
      - key: TWITTER_AUTH_TOKEN
        sync: false
      - key: NEXT_PUBLIC_TWITTER_HANDLE
        sync: false
      - key: BROWSERBASE_API_KEY
        sync: false
      - key: BROWSERBASE_PROJECT_ID
        sync: false

  # 2. Web Service for ML Predictions
  - type: web
    name: aura-ml-service
    env: python
    buildCommand: |
      cd aura-ml
      pip install -r requirements.txt
    startCommand: cd aura-ml && python run_demo.py # Replace with uvicorn command if serving an API
    envVars:
      - key: DATABASE_URL
        sync: false
